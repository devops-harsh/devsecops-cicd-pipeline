name: ci-pipeline-application

on:
    push:
        branches: [main]
        paths-ignore:
         - "Readme.md"
    pull_request:
        branches: [main]
    
env:
    REGISTERY: ghcr.io
    IMAGE_NAME: ghcr.io/${{ github.repository}}/devsecops-demo

jobs:
   test:
    name: test the code
    runs-on: ubuntu-latest 
    continue-on-error: false

    steps:
     - name: checkout the code
       uses: actions/checkout@v4
     
     - name: setup the node.js 
       uses: actions/setup-node@v7
       with:
          node-version: 20
          cache: npm
     
     - name: install the dependencies
       run: npm ci 
     
     - name: test the code
       run: npm run test || echo "no test found we currently dont have tests"
    
   lint:
    name: lint the code # lint is static code analysis uses to check programmatic error and issues in the code
    runs-on: ubuntu-latest 
    continue-on-error: true

    steps:
     - name: checkout the code
       uses: actions/checkout@v4
     
     - name: setup the node.js
       uses: actions/setup-node@v7
       with:
          node-version: 20
          cache: npm
     
     - name: install the dependencies
       run: npm ci 
    
     - name: run the the ESlint
       run: npm run lint
  
   build:
    name: build the code 
    runs-on: ubuntu-latest
    continue-on-error: false
    needs: [test, lint]

    steps:
     - name: checkout the code
       uses: actions/checkout@v4
     
     - name: setup the node.js
       uses: actions/setup-node@v7
       with:
          node-version: 20
          cache: npm
     
     - name: install the dependencies
       run: npm ci 
    
     - name: build the code
       run: npm run build
     
     - name: upload the artifact
       uses: actions/upload-artifact@v7
       with:
         name: build-artifact
         path: dist/

   docker:
    name: docker build and push 
    runs-on: ubuntu-latest 
    continue-on-error: false
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
     - name: checkout the code
       uses: actions/checkout@v4

     - name: setup docker buildx to build docker image
       uses: docker/setup-buildx-action@v4

     - name: login to github container registery 
       uses: docker/login-action@v4
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


     - name: tag metadata
       id: meta
       uses: docker/metadata-action@v6
       with:
        images: ghcr.io/${{ github.repository }}/devsecops-demo
        tags: |
             type=sha,format=short,prefix=sha-
             type=raw,value=latest,enable={{is_default_branch}}
            

     - name: docker build and push image
       uses: docker/build-push-action@v7
       with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request'}}
          tags: ${{ steps.meta.outputs.tags }}
 
   image-scan:
    name: docker image scan using trivy
    runs-on: ubuntu-latest 
    continue-on-error: true
    needs: [test, lint]

    steps:
     - name: checkout the code
       uses: actions/checkout@v4
     
     - name: build docker image
       run: docker build -t devsecops-demo:scan-${{ github.sha }} .
    
     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@v0.36.0
       with:
          image-ref: 'devsecops-demo:scan-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

   update-manifest:
    name: update the kubernetes manifest 
    runs-on: ubuntu-latest 
    needs: [test, lint, build, docker, image-scan]
    if: github.event_name == 'push'
    permissions:
      contents: write 
      packages: write 
    
    steps:
     - name: checkout the code
       uses: actions/checkout@v4

     - name: get shorty sha for image tag
       id: sha
       run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

     - name: update k8s manifest 
       run: |
            IMAGE="${{env.IMAGE_NAME}}:sha-${{ steps.sha.outputs.short }}"

            sed -i "s|^\(\s*image:\s*\).*|\1${IMAGE}|" kubernetes/deployment.yaml

            echo "image is updated"
     
     - name: commit and push 
       run: |
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add kubernetes/deployment.yaml
            git diff --quiet || git commit -m "updates the kubernetes image with tag ${{ steps.sha.outputs.short}}"
            git push origin main
         
           



    
    


      
  
   

  


